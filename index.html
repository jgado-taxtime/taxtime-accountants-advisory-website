<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tax Time Accountants Advisory | New website coming soon</title>
<meta name="description" content="Tax Time Accountants Advisory. Tax preparation and accounting in South Florida. Our new website is coming soon.">
<link rel="icon" href="assets/mark-t.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#16234A;--deep:#0F1A38;--gold:#C9A24B;--gold-hi:#D8B360;--cream:#F5F0E8;--slate:#B9C2D9;--head:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.65;color:var(--cream);background:var(--navy);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:2px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.card{max-width:640px;width:100%;text-align:center}
.card img.logo{height:64px;width:auto;margin:0 auto 40px}
h1{font-family:var(--head);font-weight:700;font-size:clamp(34px,6vw,52px);line-height:1.1;letter-spacing:-.01em;margin:0 0 16px;color:#fff}
.rule{width:64px;height:3px;background:var(--gold);margin:0 auto 24px;border:0}
.lede{text-wrap:balance;font-size:19px;color:var(--slate);margin:0 0 36px}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 22px;font:600 15px/1 var(--head);text-decoration:none;border-radius:4px;border:2px solid var(--gold);background:var(--gold);color:var(--navy);transition:background .2s,border-color .2s}
.btn:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.ghost{background:transparent;color:var(--cream)}
.btn.ghost:hover{background:rgba(201,162,75,.15);border-color:var(--gold-hi)}
footer{text-wrap:balance;padding:20px 24px;text-align:center;font-size:14px;color:var(--slate);border-top:1px solid rgba(201,162,75,.4);background:var(--deep)}
@media(max-width:480px){.card img.logo{height:52px;margin-bottom:32px}.lede{font-size:17px}.btn{width:100%}}
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="assets/logo.svg" alt="Tax Time Accountants Advisory" width="260" height="64">
    <h1>Our new website is coming soon</h1>
    <hr class="rule">
    <p class="lede">Tax preparation and accounting in South Florida. Call or email us in the meantime.</p>
    <div class="btn-row">
      <a class="btn" href="tel:+14072052555">Call 407-205-2555</a>
      <a class="btn ghost" href="mailto:info@taxtimeaccountantsfl.com">Email us</a>
    </div>
  </div>
</main>
<footer>101 NE Third Ave, Ste 1500, Fort Lauderdale, FL 33301</footer>
</body>
</html>
